# anomaly.yaml
# MVP set: 2 fragments per intensity (0-3), covering visual, sound, smell, memory,
# all using 3 tiers (human / latent / instinct), plus 1 generic fallback.

- id: anomaly_visual_01
  category: anomaly
  key: visual
  intensity: 0
  tiers:
    human:
      zh: |
        眼角余光闪过一道极细的网格，像老式显示器上的噪点。你眨了眨眼，它就消失了。
      en: |
        A hairline grid flickers at the edge of your sight, like static on an old monitor. When you blink, it is gone.
    latent:
      zh: |
        视野边缘浮出几十个透明的六边形格栅，把昏暗的光线切成了碎块。
      en: |
        Dozens of translucent hexagonal cells surface along your peripheral vision, dicing the dim light into shards.
    instinct:
      zh: |
        左边的复眼格栅暗了一瞬，又亮起来。一切都很整齐，只是视角比你记忆里宽了一倍。
      en: |
        Your left compound grid dims for a beat, then clears. Everything aligns neatly, though the field of view is twice as wide as you remember.

- id: anomaly_sound_01
  category: anomaly
  key: sound
  intensity: 0
  tiers:
    human:
      zh: |
        寂静里夹着一丝极轻的咔哒声，像是某台机器在远处空转了一格。
      en: |
        A faint click threads through the quiet, as if some distant mechanism ticked forward by one notch.
    latent:
      zh: |
        你听见一声细小的脉冲在颅骨内侧响起，紧接着是一阵微弱的振翅回音。
      en: |
        A tiny pulse snaps inside your skull, followed by the faintest echo of vibrating wings.
    instinct:
      zh: |
        那不是外面的声音。是你自己的突触在替另一段回路报数。
      en: |
        It is not coming from the room. It is your own synapses ticking off the count for another circuit.

- id: anomaly_smell_01
  category: anomaly
  key: smell
  intensity: 1
  tiers:
    human:
      zh: |
        鼻腔里忽然掠过一股发酵的甜酸味，混着一点刺鼻的固定液气息，很快又散了。
      en: |
        A whiff of fermented sweetness crosses your nose, sharp with a hint of fixative, then fades.
    latent:
      zh: |
        甜味像一条发光的虚线钻进鼻腔，你的脚步不自觉地往那个方向偏了半寸。
      en: |
        Sweetness threads into your nostrils like a glowing trail; your next step drifts half an inch toward it before you catch yourself.
    instinct:
      zh: |
        趋近信号。源头就在前面不远处，甜得让口器发痒。
      en: |
        Approach signal. The source is close ahead, sweet enough to make your mouthparts ache.

- id: anomaly_memory_01
  category: anomaly
  key: memory
  intensity: 1
  tiers:
    human:
      zh: |
        你突然想起一只戴着橡胶手套的手，正小心地把你的名字贴在玻璃上。可你根本不记得自己什么时候去过那里。
      en: |
        You suddenly remember a gloved hand carefully labeling glass with your name—yet you have no memory of ever being there.
    latent:
      zh: |
        那只手套在强光下抖了一下。你同时看见指尖的微颤，也看见玻璃后面无数双复眼在微微反光。
      en: |
        The gloved hand trembles under the lamp. You see both the twitch of the fingers and the glint of countless facets behind the glass.
    instinct:
      zh: |
        她当时哭了，你记得那种咸涩。她说，再切最后一片就够了。
      en: |
        She was crying then—you remember the salt of it. Just one last section, she whispered, and it will be enough.

- id: anomaly_visual_02
  category: anomaly
  key: visual
  intensity: 2
  effects:
    sync: 5
  tiers:
    human:
      zh: |
        面前的空气骤然裂成无数重叠的残影，每一帧里你的双手都比上一帧慢了半拍。
      en: |
        The air ahead fractures into overlapping afterimages; in every frame, your hands lag half a beat behind your intent.
    latent:
      zh: |
        七千个六边形切面同时在你眼前展开，把墙面、阴影和你自己的指尖拆成密密麻麻的像素。
      en: |
        Seven thousand hexagonal facets unfold across your sight at once, breaking walls, shadows, and your own fingertips into a hive of pixels.
    instinct:
      zh: |
        复眼已经校准完成。黑暗不再是障碍，你看见了气流在空间里流动的纹路。
      en: |
        The compound array is calibrated. Darkness no longer blinds you; you can see the currents of air braiding through the room.

- id: anomaly_sound_02
  category: anomaly
  key: sound
  intensity: 2
  effects:
    sync: 6
  tiers:
    human:
      zh: |
        一阵低沉的嗡鸣直接钻进你的耳膜，音调冰冷而整齐，像有人在用你的心跳打拍子。
      en: |
        A low, mechanical hum bores straight into your eardrums, cold and rhythmic, as if something is keeping time with your pulse.
    latent:
      zh: |
        你的呼吸声被某种更大的节律吞了进去。每呼出一口气，就有成百上千个细小的回声替你接上后半句。
      en: |
        Your breathing is swallowed by a larger cadence. Every exhale is finished for you by a hundred tiny echoes.
    instinct:
      zh: |
        那是我们的同步频率。你张开嘴，发出的却是一声连自己都听不懂的振颤。
      en: |
        That is our sync frequency. You open your mouth, and what spills out is a vibration you no longer know how to translate.

- id: anomaly_smell_02
  category: anomaly
  key: smell
  intensity: 3
  effects:
    sync: 9
  tiers:
    human:
      zh: |
        浓烈得令人作呕的乙醇与腐甜气味猛地灌满你的鼻腔，喉咙像被无形的针刺穿，胃里一阵剧烈翻涌。
      en: |
        A suffocating wave of ethanol and rotting sweetness floods your nose; your throat tightens as if pierced, and your stomach heaves.
    latent:
      zh: |
        你的嗅觉突然裂成两半：一半在拼命干呕，另一半却疯狂地分泌唾液，渴望扑进那股刺鼻的甜香里。
      en: |
        Your sense of smell splits in two: half of you gags violently, while the other half floods your mouth with saliva, desperate to dive into the sweet stench.
    instinct:
      zh: |
        排斥信号已经熄灭。固定液的味道不再刺鼻——那是浸泡着整座记忆库的羊水。
      en: |
        Avoidance has shut down. The fixative no longer burns—it smells like the warm broth where every memory sleeps.

- id: anomaly_memory_02
  category: anomaly
  key: memory
  intensity: 3
  effects:
    sync: 11
  tiers:
    human:
      zh: |
        零点前那几分钟的空白突然塌陷：冰冷的金属台面、刺目的白光、某种细高频的震动贴近眉心。你猛地捂住额头，冷汗浸透了后背。
      en: |
        The blank minutes before midnight suddenly cave in: cold steel, blinding white light, a fine high-pitched hum grazing your brow. You clutch your forehead, drenched in cold sweat.
    latent:
      zh: |
        你忽然记起自己薄得透光的样子——一格一格排在冷液里，等待电子束扫过。你分不清这是你的记忆，还是正在读取你的人的记忆。
      en: |
        You suddenly remember being thin enough for light to pass through—racked in cold fluid, waiting for the beam. You cannot tell whether the memory is yours or the reader's.
    instinct:
      zh: |
        切片早已归位，可那段关于“逃出去”的旧回路还在空转。你迈出这一步，不过是在替它重演一次答案。
      en: |
        The tray is already full, yet the old loop labeled escape keeps firing on its own. Every step you take only replays the answer for it.

- id: anomaly_generic_01
  category: anomaly
  key: generic
  tiers:
    human:
      zh: |
        周遭的空气陡然冷了一瞬，某种说不清的错位感顺着脊椎爬了上来。
      en: |
        The air around you drops a degree for no reason, and an unnamed wrongness crawls up your spine.
    latent:
      zh: |
        感官的边缘轻微错齿，仿佛有另一双眼睛正借着你的视神经向外张望。
      en: |
        The edges of your senses slip out of gear, as if another pair of eyes is peering out through your optic nerve.
    instinct:
      zh: |
        一次微小的校准脉冲掠过皮层。你停在原地，等待下一条指令。
      en: |
        A brief calibration pulse sweeps across the cortex. You stand still, waiting for the next stimulus.

# --- 11-16 playtest: more anomaly variants so the same room does not loop ----

- id: anomaly_sound_03
  category: anomaly
  key: sound
  intensity: 0
  zh: |
    机柜深处传来一串细碎的咔哒声，节奏不像机器，更像什么东西在用很多只脚轻轻敲击。
  en: |
    A patter of tiny clicks rises from deep inside the racks, too irregular for a machine, more like many small feet tapping.

- id: anomaly_sound_04
  category: anomaly
  key: sound
  intensity: 1
  zh: |
    耳边的嗡鸣忽高忽低，你试着屏住呼吸，它也跟着停了一拍。
  en: |
    The hum in your ears rises and falls. When you hold your breath, it skips a beat with you.

- id: anomaly_sound_05
  category: anomaly
  key: sound
  intensity: 1
  zh: |
    你听见有人在很远的地方念一串数字，四〇九五，四〇九六……声音像是从墙的另一面贴过来的。
  en: |
    Somewhere far away a voice counts — four-oh-nine-five, four-oh-nine-six — as if pressed to the other side of the wall.

- id: anomaly_sound_06
  category: anomaly
  key: sound
  intensity: 2
  effects:
    sync: 5
  zh: |
    嗡鸣突然离得很近，近到你分不清它是在屋里，还是在你的颅骨里面。
  en: |
    Suddenly the hum is very close, so close you cannot tell whether it is in the room or inside your skull.

- id: anomaly_sound_07
  category: anomaly
  key: sound
  intensity: 3
  effects:
    sync: 9
  zh: |
    所有的振翅声在同一刻停下，然后整齐地喊出了你的名字。不是用声音，是用频率。
  en: |
    Every wingbeat stops at once, then calls your name in unison. Not in a voice. In a frequency.

- id: anomaly_visual_03
  category: anomaly
  key: visual
  intensity: 0
  zh: |
    手电光圈的边缘闪过一个黑点，你转头去看，它已经不在了。
  en: |
    A black speck flicks across the edge of your light. When you turn, it is gone.

- id: anomaly_visual_04
  category: anomaly
  key: visual
  intensity: 1
  zh: |
    墙上的影子比你慢了半拍才跟着你转身。
  en: |
    Your shadow on the wall turns half a beat after you do.

- id: anomaly_visual_05
  category: anomaly
  key: visual
  intensity: 3
  effects:
    sync: 9
  zh: |
    你眨了一下眼，视野碎成几百个小格，每一格里都有一个你，正从不同的角度看着自己。
  en: |
    You blink and your sight shatters into hundreds of small cells. In every one of them is you, watching yourself from another angle.

- id: anomaly_smell_03
  category: anomaly
  key: smell
  intensity: 0
  zh: |
    空气里飘来一丝熟透的香蕉味，甜得发腻，你的口水不受控制地多了起来。
  en: |
    A whiff of overripe banana drifts by, cloyingly sweet. Your mouth floods before you can stop it.

- id: anomaly_smell_04
  category: anomaly
  key: smell
  intensity: 2
  effects:
    sync: 5
  zh: |
    那股发酵的甜味浓得像一只手捂住了你的口鼻，你发现自己正顺着它的方向侧过头去。
  en: |
    The fermented sweetness thickens like a hand over your mouth, and you find your head turning to follow it.

- id: anomaly_memory_03
  category: anomaly
  key: memory
  intensity: 0
  zh: |
    你想不起自己今晚是怎么进楼的。只记得门很重，手里的笔很冷。
  en: |
    You cannot remember how you came into the building tonight. Only that the door was heavy and the pen in your hand was cold.

- id: anomaly_memory_04
  category: anomaly
  key: memory
  intensity: 2
  effects:
    sync: 5
  zh: |
    一段不属于你的记忆浮上来：一片熟烂的桃子，阳光，和成千上万个同伴落在上面的重量。
  en: |
    A memory that is not yours surfaces: a rotting peach, sunlight, and the weight of thousands of others landing on it with you.
