# hijack.yaml
# MVP set: eat, flinch, freeze (using {target}) + 1 generic fallback.

- id: hijack_eat_01
  category: hijack
  key: eat
  zh: |
    你的手伸向{target}，却在半路违背了你的意志。你的嘴唇自己张开，舌尖不受控制地迎了上去，仿佛饿了整整七千个昼夜。
  en: |
    You reach for {target}, but your arm betrays you mid-reach. Your lips part on their own and your tongue strains forward, starved across seven thousand nights.

- id: hijack_flinch_01
  category: hijack
  key: flinch
  zh: |
    一股不属于你的剧烈惊跳猛地接管了脊椎。你还没来得及触及{target}，整个人就失控地缩成一团，像被强光惊退的虫影。
  en: |
    A violent startle reflex that is not yours snaps down your spine. Before you can reach {target}, your whole body recoils into a crouch like something fleeing a lamp.

- id: hijack_freeze_01
  category: hijack
  key: freeze
  zh: |
    你想朝{target}动一下，双腿却像被钉死在地板上。恐惧卡在喉咙里，你只能眼睁睁看着自己的手指慢慢垂落。
  en: |
    You will yourself toward {target}, yet your legs lock fast to the floor. Panic jams in your throat as you watch your own fingers go slack.

- id: hijack_generic_01
  category: hijack
  key: generic
  zh: |
    运动皮层忽然被另一股脉冲压住，你的身体先你一步做出了完全陌生的反应。
  en: |
    Another pulse overrides your motor cortex, and your body executes an unfamiliar reflex before you can stop it.
