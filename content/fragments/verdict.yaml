# verdict.yaml
# MVP set: 14 action keys, 2 verdict_partial defaults, 5 verdict_fail reasons,
# plus 1 generic fallback per category.

- id: action_look_01
  category: action
  key: look
  zh: |
    你凑近去端详{target}，眼皮却莫名发沉，仿佛暗处也有什么东西正借着你的视线一起打量。
  en: |
    You lean in to examine {target}, though your eyelids feel oddly heavy, as if something in the dark is looking through your eyes alongside you.

- id: action_move_01
  category: action
  key: move
  zh: |
    你迈步朝{target}走去。鞋底踩在地面上发出轻响，回声却比你的脚步慢了半拍。
  en: |
    You step toward {target}. Your soles click against the floor, and the echo answers half a beat too late.

- id: action_take_01
  category: action
  key: take
  zh: |
    你伸手抓起{target}，指尖触到一阵微凉，像是刚才还有别的东西碰过它。
  en: |
    You reach out and take {target}. It feels faintly cool against your palm, as if something else let go of it a second ago.

- id: action_use_01
  category: action
  key: use
  zh: |
    你握紧{target}，照着记忆里的动作试着操作它，呼吸不自觉地屏住了。
  en: |
    You grip {target} and put it to work the way your hands remember, holding your breath without realizing it.

- id: action_eat_01
  category: action
  key: eat
  zh: |
    你把{target}送进嘴里。舌尖刚一碰到，喉咙深处就泛起一阵本能般的躁动。
  en: |
    You lift {target} to your mouth. The moment it touches your tongue, an unfamiliar reflex stirs at the back of your throat.

- id: action_smell_01
  category: action
  key: smell
  zh: |
    你低头轻嗅{target}，微弱的气味钻进鼻腔，在脑海里勾起一丝难以言喻的躁意。
  en: |
    You lean down and draw in the scent of {target}; a faint chemical note threads into your sinuses and leaves your nerves on edge.

- id: action_listen_01
  category: action
  key: listen
  zh: |
    你停下动作屏息细听，除了自己的心跳，耳膜里似乎还贴着一层极细的振颤。
  en: |
    You freeze and strain your ears. Beneath your own pulse, a paper-thin vibration seems to press right against your eardrums.

- id: action_touch_01
  category: action
  key: touch
  zh: |
    你用指腹轻轻碰了碰{target}，指尖传来的质感陌生得像隔了一层手套。
  en: |
    You brush your fingertips across {target}. The texture registers strangely, as though you were feeling it through thin rubber gloves.

- id: action_light_01
  category: action
  key: light
  zh: |
    微光骤然跳起，在潮湿的黑暗里切出一块晃动的亮区，影子随之剧烈一抖。
  en: |
    A flare of light catches and carves a trembling pocket out of the dark, sending the shadows jerking backward.

- id: action_attack_01
  category: action
  key: attack
  zh: |
    你猛地朝{target}挥出手去，动作快得连自己都吃了一惊，风声在耳边一闪而过。
  en: |
    You lash out at {target} with a suddenness that surprises even you, the rush of air snapping past your ear.

- id: action_hide_01
  category: action
  key: hide
  zh: |
    你尽量缩紧肩膀躲进{target}旁的暗处，连吞咽口水的声音都不敢发出来。
  en: |
    You pull your shoulders tight and tuck yourself into the shadow by {target}, not even daring to swallow.

- id: action_wait_01
  category: action
  key: wait
  zh: |
    你站在原地没有动，任由时间一秒一秒地淌过去，黑暗里的轮廓似乎悄悄挪近了一寸。
  en: |
    You stay still and let the seconds drip past. Somewhere in the dark, the shapes around you seem to shift an inch closer.

- id: action_talk_01
  category: action
  key: talk
  zh: |
    你压低嗓音出了声，话音刚落就被空旷的黑暗吸了进去，显得单薄又可疑。
  en: |
    You speak under your breath, and the dark swallows the words before they finish leaving your mouth, thin and exposed.

- id: action_other_01
  category: action
  key: other
  zh: |
    你顺着念头做出了这个举动，指节微微发僵，仿佛身体先于意识完成了指令。
  en: |
    You follow the impulse through. Your knuckles stiffen, as if your body executed the command a fraction before you chose it.

- id: action_generic_01
  category: action
  key: generic
  zh: |
    你试着那样做了，黑暗里没有立刻给出回应。
  en: |
    You carry out the motion, and the dark gives no immediate answer.

- id: verdict_partial_default_01
  category: verdict_partial
  key: default
  zh: |
    你勉强做到了，可手腕抖得厉害，发出的声响比你预想的大得多，像在空楼里敲了一记。
  en: |
    You barely pull it off. Your wrist shakes violently, and the noise carries much farther through the dead building than you meant it to.

- id: verdict_partial_default_02
  category: verdict_partial
  key: default
  zh: |
    事情总算成了，但你扯疼了僵硬的指关节，呼吸也乱了半拍，胸口发闷。
  en: |
    It works, after a fashion, though you wrench a stiff knuckle in the process and your breathing catches, leaving a tight ache in your chest.

- id: verdict_partial_generic_01
  category: verdict_partial
  key: generic
  zh: |
    动作勉强完成了，只是代价正顺着神经末梢慢慢渗出来。
  en: |
    You scrape by, though the cost is already seeping quietly up your nerves.

- id: verdict_fail_physically_impossible_01
  category: verdict_fail
  key: physically_impossible
  zh: |
    物理边界拒绝了这次尝试。某种冰冷的视线记录下你的徒劳，像在核对一条已知失败的样本参数。
  en: |
    Physical limits reject the attempt. Something cold records your futility, as if logging a parameter that was never meant to pass.

- id: verdict_fail_missing_item_01
  category: verdict_fail
  key: missing_item
  zh: |
    你手里没有能对付{target}的东西。念头悬在半空，被干脆地驳回。
  en: |
    You lack the tool needed to act on {target}. Without it, your intent stalls mid-motion and is summarily overruled.

- id: verdict_fail_no_such_target_01
  category: verdict_fail
  key: no_such_target
  zh: |
    这片黑暗里没有你要找的{target}。你的视线扫过空处，只换来一声无声的否定。
  en: |
    There is no {target} anywhere in this dark. Your eyes sweep empty air and meet a silent, flat denial.

- id: verdict_fail_against_world_rules_01
  category: verdict_fail
  key: against_world_rules
  zh: |
    这里不允许你对{target}这么做。念头刚成形，就被一道更冷的判决按了回去。
  en: |
    What you want with {target} is not permitted here. The impulse is pushed back down by a colder verdict before your hands can even rise.

- id: verdict_fail_not_an_action_01
  category: verdict_fail
  key: not_an_action
  zh: |
    那算不上一个有效的动作。你僵在原地，感觉有什么东西在暗处冷静地划掉了一行无效输入。
  en: |
    That does not register as a valid action. You stand frozen, feeling something in the dark calmly cross out a meaningless line.

- id: verdict_fail_generic_01
  category: verdict_fail
  key: generic
  zh: |
    不可行。判决冰冷地落下，不留余地。
  en: |
    Infeasible. The verdict drops without appeal.
