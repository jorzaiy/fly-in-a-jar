# verdict.yaml
# MVP set: 14 action keys, 2 verdict_partial defaults, 5 verdict_fail reasons,
# plus 1 generic fallback per category.

- id: action_look_01
  category: action
  key: look
  zh: |
    你凑近去端详{target}，眼皮却莫名发沉，仿佛暗处也有什么东西正借着你的视线一起打量。
  en: |
    You lean in to examine {target}, though your eyelids feel oddly heavy, as if something in the dark is looking through your eyes alongside you.

- id: action_move_01
  category: action
  key: move
  zh: |
    你迈步朝{target}走去。鞋底踩在地面上发出轻响，回声却比你的脚步慢了半拍。
  en: |
    You step toward {target}. Your soles click against the floor, and the echo answers half a beat too late.

- id: action_take_01
  category: action
  key: take
  zh: |
    你伸手抓起{target}，指尖触到一阵微凉，像是刚才还有别的东西碰过它。
  en: |
    You reach out and take {target}. It feels faintly cool against your palm, as if something else let go of it a second ago.

- id: action_use_01
  category: action
  key: use
  zh: |
    你握紧{target}，照着记忆里的动作试着操作它，呼吸不自觉地屏住了。
  en: |
    You grip {target} and put it to work the way your hands remember, holding your breath without realizing it.

- id: action_eat_01
  category: action
  key: eat
  zh: |
    你把{target}送进嘴里。舌尖刚一碰到，喉咙深处就泛起一阵本能般的躁动。
  en: |
    You lift {target} to your mouth. The moment it touches your tongue, an unfamiliar reflex stirs at the back of your throat.

- id: action_smell_01
  category: action
  key: smell
  zh: |
    你低头轻嗅{target}，微弱的气味钻进鼻腔，在脑海里勾起一丝难以言喻的躁意。
  en: |
    You lean down and draw in the scent of {target}; a faint chemical note threads into your sinuses and leaves your nerves on edge.

- id: action_listen_01
  category: action
  key: listen
  zh: |
    你停下动作屏息细听，除了自己的心跳，耳膜里似乎还贴着一层极细的振颤。
  en: |
    You freeze and strain your ears. Beneath your own pulse, a paper-thin vibration seems to press right against your eardrums.

- id: action_touch_01
  category: action
  key: touch
  zh: |
    你用指腹轻轻碰了碰{target}，指尖传来的质感陌生得像隔了一层手套。
  en: |
    You brush your fingertips across {target}. The texture registers strangely, as though you were feeling it through thin rubber gloves.

- id: action_light_01
  category: action
  key: light
  zh: |
    微光骤然跳起，在潮湿的黑暗里切出一块晃动的亮区，影子随之剧烈一抖。
  en: |
    A flare of light catches and carves a trembling pocket out of the dark, sending the shadows jerking backward.

- id: action_attack_01
  category: action
  key: attack
  zh: |
    你猛地朝{target}挥出手去，动作快得连自己都吃了一惊，风声在耳边一闪而过。
  en: |
    You lash out at {target} with a suddenness that surprises even you, the rush of air snapping past your ear.

- id: action_hide_01
  category: action
  key: hide
  zh: |
    你尽量缩紧肩膀躲进{target}旁的暗处，连吞咽口水的声音都不敢发出来。
  en: |
    You pull your shoulders tight and tuck yourself into the shadow by {target}, not even daring to swallow.

- id: action_wait_01
  category: action
  key: wait
  zh: |
    你站在原地没有动，任由时间一秒一秒地淌过去，黑暗里的轮廓似乎悄悄挪近了一寸。
  en: |
    You stay still and let the seconds drip past. Somewhere in the dark, the shapes around you seem to shift an inch closer.

- id: action_talk_01
  category: action
  key: talk
  zh: |
    你压低嗓音出了声，话音刚落就被空旷的黑暗吸了进去，显得单薄又可疑。
  en: |
    You speak under your breath, and the dark swallows the words before they finish leaving your mouth, thin and exposed.

- id: action_other_01
  category: action
  key: other
  zh: |
    你顺着念头做出了这个举动，指节微微发僵，仿佛身体先于意识完成了指令。
  en: |
    You follow the impulse through. Your knuckles stiffen, as if your body executed the command a fraction before you chose it.

- id: action_generic_01
  category: action
  key: generic
  zh: |
    你试着那样做了，黑暗里没有立刻给出回应。
  en: |
    You carry out the motion, and the dark gives no immediate answer.

- id: verdict_partial_default_01
  category: verdict_partial
  key: default
  zh: |
    你勉强做到了，可手腕抖得厉害，发出的声响比你预想的大得多，像在空楼里敲了一记。
  en: |
    You barely pull it off. Your wrist shakes violently, and the noise carries much farther through the dead building than you meant it to.

- id: verdict_partial_default_02
  category: verdict_partial
  key: default
  zh: |
    事情总算成了，但你扯疼了僵硬的指关节，呼吸也乱了半拍，胸口发闷。
  en: |
    It works, after a fashion, though you wrench a stiff knuckle in the process and your breathing catches, leaving a tight ache in your chest.

- id: verdict_partial_generic_01
  category: verdict_partial
  key: generic
  zh: |
    动作勉强完成了，只是代价正顺着神经末梢慢慢渗出来。
  en: |
    You scrape by, though the cost is already seeping quietly up your nerves.

- id: verdict_fail_physically_impossible_01
  category: verdict_fail
  key: physically_impossible
  zh: |
    物理边界拒绝了这次尝试。某种冰冷的视线记录下你的徒劳，像在核对一条已知失败的样本参数。
  en: |
    Physical limits reject the attempt. Something cold records your futility, as if logging a parameter that was never meant to pass.

- id: verdict_fail_missing_item_01
  category: verdict_fail
  key: missing_item
  zh: |
    你手里没有能对付{target}的东西。念头悬在半空，被干脆地驳回。
  en: |
    You lack the tool needed to act on {target}. Without it, your intent stalls mid-motion and is summarily overruled.

- id: verdict_fail_no_such_target_01
  category: verdict_fail
  key: no_such_target
  zh: |
    这片黑暗里没有你要找的{target}。你的视线扫过空处，只换来一声无声的否定。
  en: |
    There is no {target} anywhere in this dark. Your eyes sweep empty air and meet a silent, flat denial.

- id: verdict_fail_against_world_rules_01
  category: verdict_fail
  key: against_world_rules
  zh: |
    这里不允许你对{target}这么做。念头刚成形，就被一道更冷的判决按了回去。
  en: |
    What you want with {target} is not permitted here. The impulse is pushed back down by a colder verdict before your hands can even rise.

- id: verdict_fail_not_an_action_01
  category: verdict_fail
  key: not_an_action
  zh: |
    那算不上一个有效的动作。你僵在原地，感觉有什么东西在暗处冷静地划掉了一行无效输入。
  en: |
    That does not register as a valid action. You stand frozen, feeling something in the dark calmly cross out a meaningless line.

- id: verdict_fail_generic_01
  category: verdict_fail
  key: generic
  zh: |
    不可行。判决冰冷地落下，不留余地。
  en: |
    Infeasible. The verdict drops without appeal.

# --- 11-16 playtest: more action variants so lines rotate ------------------

- id: action_look_02
  category: action
  key: look
  zh: |
    你眯起眼睛打量{target}。看得越久，它的轮廓越像在微微起伏。
  en: |
    You narrow your eyes at {target}. The longer you look, the more its outline seems to breathe.

- id: action_look_03
  category: action
  key: look
  zh: |
    你的目光在{target}上停了很久，久到你开始怀疑，是谁在看谁。
  en: |
    Your gaze rests on {target} so long you start to wonder which of you is doing the looking.

- id: action_move_02
  category: action
  key: move
  zh: |
    你贴着墙往{target}挪过去，指尖一路擦过冰冷的墙皮。
  en: |
    You edge along the wall toward {target}, fingertips trailing over cold plaster.

- id: action_move_03
  category: action
  key: move
  zh: |
    你放轻脚步走向{target}。黑暗里，有什么东西跟着你的节奏轻轻振了一下翅。
  en: |
    You walk softly toward {target}. Somewhere in the dark, something beats its wings once in time with your steps.

- id: action_move_04
  category: action
  key: move
  zh: |
    你朝{target}走去。走廊的灯管闪了一下，你的影子在地上多出了几条细腿。
  en: |
    You head for {target}. A tube light flickers, and for an instant your shadow sprouts extra thin legs.

- id: action_take_02
  category: action
  key: take
  zh: |
    你把{target}揣进口袋，布料下传来它轻微的重量。
  en: |
    You slip {target} into your pocket and feel its small weight against you.

- id: action_take_03
  category: action
  key: take
  zh: |
    你拿起{target}。手指合拢的那一刻，掌心莫名地发痒。
  en: |
    You pick up {target}. As your fingers close, your palm itches for no reason.

- id: action_take_04
  category: action
  key: take
  zh: |
    你迅速把{target}收好，像怕被谁看见似的。
  en: |
    You tuck {target} away quickly, as though someone might be watching.

- id: action_use_02
  category: action
  key: use
  zh: |
    你试着摆弄{target}，手上的动作比你想的更熟练，像以前做过很多次。
  en: |
    You work at {target}, your hands surer than they should be, as if they had done this many times.

- id: action_use_03
  category: action
  key: use
  zh: |
    你拿着{target}比划了一下，没发生什么。也许不是在这里，也许不是这样用。
  en: |
    You try {target} this way and that. Nothing happens. Maybe not here. Maybe not like this.

- id: action_use_04
  category: action
  key: use
  zh: |
    你把{target}翻来覆去地试了几次，四周只传来自己的呼吸声。
  en: |
    You turn {target} over and try it a few times. All you hear is your own breathing.

- id: action_touch_02
  category: action
  key: touch
  zh: |
    你伸手碰了碰{target}，表面有一层说不清的黏腻，像刚被许多细小的脚爬过。
  en: |
    You touch {target}. Its surface has a faint tackiness, as though many tiny feet had just crossed it.

- id: action_touch_03
  category: action
  key: touch
  zh: |
    你的指尖按在{target}上，冷意顺着指骨爬上来，一直爬到后颈。
  en: |
    You lay your fingertips on {target}. The cold climbs your finger bones all the way to the back of your neck.

- id: action_listen_02
  category: action
  key: listen
  zh: |
    你屏住呼吸听了很久。楼里很安静，安静得像是所有东西都在同时屏息。
  en: |
    You hold your breath and listen. The building is quiet, as if everything in it were holding its breath with you.

- id: action_smell_02
  category: action
  key: smell
  zh: |
    你吸了吸鼻子。空气里有消毒水、旧纸，还有一丝熟透水果似的甜。
  en: |
    You sniff. Disinfectant, old paper, and a sweetness like overripe fruit.

- id: action_wait_02
  category: action
  key: wait
  zh: |
    你靠着墙等了一会儿。黑暗没有动，但你总觉得它离你近了一点。
  en: |
    You lean on the wall and wait. The dark does not move, but it feels a little closer.

- id: action_hide_02
  category: action
  key: hide
  zh: |
    你缩进{target}的阴影里，把心跳压到最低。外面的嗡鸣绕了一圈，又远了。
  en: |
    You fold yourself into the shadow of {target} and slow your heart. The hum outside circles once and fades.

- id: action_other_02
  category: action
  key: other
  zh: |
    你照着自己的想法做了。四周没什么变化，只是你的手指比刚才更僵了一点。
  en: |
    You do as you meant to. Nothing around you changes, only your fingers are a little stiffer than before.

- id: action_other_03
  category: action
  key: other
  zh: |
    你做完这个动作，停下来等了等。这栋楼没有回应，像是在看你下一步要做什么。
  en: |
    You finish and wait. The building gives no answer, as if waiting to see what you do next.

- id: action_generic_02
  category: action
  key: generic
  zh: |
    你做了。黑暗吞下了这个动作，没有任何回音。
  en: |
    You do it. The dark swallows the gesture without an echo.

- id: action_generic_03
  category: action
  key: generic
  zh: |
    什么也没有改变。也许要换个地方，或者换样东西。
  en: |
    Nothing changes. Perhaps another place, or another thing.

- id: verdict_partial_default_03
  category: verdict_partial
  key: default
  zh: |
    成了，只是比预想的费劲。你停下来喘口气，发现自己的手指在无意识地互相摩擦。
  en: |
    It works, though harder than it should have been. You pause for breath and notice your fingertips rubbing together on their own.

- id: verdict_partial_default_04
  category: verdict_partial
  key: default
  zh: |
    你做到了，但动静太大。远处的嗡鸣顿了一顿，像是转过头来听了听。
  en: |
    You manage it, but too loudly. The distant hum pauses, as if turning its head to listen.

- id: verdict_partial_default_05
  category: verdict_partial
  key: default
  zh: |
    勉强完成。有那么一瞬间，你的手不太像是你自己的。
  en: |
    Barely done. For a moment, your hands did not quite feel like yours.
