# item_use.yaml
# MVP set: 12 item_use keys + 1 generic fallback (no effects allowed here).

- id: item_use_fuse_frostbite_01
  category: item_use
  key: fuse_frostbite
  zh: |
    裸露的指尖刚碰上冰柜里的陶瓷保险丝，皮肤就像被冰铁咬住一样粘在上面。你猛地扯回手，指腹瞬间冻得惨白麻木，什么也没能拿出来。
  en: |
    The moment your bare fingers touch the ceramic fuse inside the freezer, skin sticks fast to the frost. You yank your hand back white and numb, leaving the fuse behind.

- id: item_use_keycard_tangled_01
  category: item_use
  key: keycard_tangled
  zh: |
    门禁卡的挂绳死死绞在机械臂的金属关节里。你使劲拽了两下，卡带纹丝不动，反倒扯得她的肩膀微微一晃。
  en: |
    The keycard lanyard is wound tight around the steel joint of the robotic arm. You tug twice, but the strap refuses to budge, only rocking her motionless shoulder slightly.

- id: item_use_restore_power_01
  category: item_use
  key: restore_power
  zh: |
    新保险丝严丝合缝地卡进槽位。你推上电闸，一阵沉闷的电流声沿着墙壁贯通整栋大楼，仿佛有什么沉睡的巨兽长长吸了一口气。紧接着，楼道深处的嗡鸣一下子醒了，成千上万对翅膀同时振动起来。
  en: |
    The new fuse snaps home. You throw the breaker, and a low surge of current runs through the walls like something vast drawing a long, waking breath. Then, deep in the halls, the hum wakes all at once: thousands of wings starting together.

- id: item_use_light_01
  category: item_use
  key: light
  zh: |
    你按下开关，手电筒吐出一圈惨白的光束。黑暗被迫退开几步，却把光圈之外的影子衬得更浓。
  en: |
    You thumb the switch and the flashlight throws a clean white circle. The dark retreats a few paces, making the shadows beyond the beam look twice as thick.

- id: item_use_plug_ears_01
  category: item_use
  key: plug_ears
  zh: |
    你把泡棉耳塞用力摁进耳道。外界的嗡鸣瞬间退远了一层，取而代之的是自己颅腔里愈发清晰的血液搏动声。
  en: |
    You press the foam earplugs deep into your ears. The building's hum drops back a layer, leaving the pulse inside your own skull louder than before.

- id: item_use_bait_01
  category: item_use
  key: bait
  zh: |
    你把方糖远远抛向暗处。碎糖落地的瞬间，半空中的嗡鸣像被无形的线扯住，哗地一声朝那个方向涌了过去。
  en: |
    You toss the sugar cube far into the dark. The instant it skitters across the floor, the hum snaps toward it like iron filings to a magnet.

- id: item_use_catch_fly_01
  category: item_use
  key: catch_fly
  zh: |
    你手腕一翻扣上管口，把其中一只果蝇封进了玻璃管。它在管壁内侧疯狂撞击，细小的振翅声透过玻璃传到你的掌心。
  en: |
    You flick the cap shut and seal a single fly inside the glass vial. It throws itself against the wall again and again, buzzing straight into your palm.

- id: item_use_stun_01
  category: item_use
  key: stun
  zh: |
    CO₂ 麻醉垫嘶嘶地喷出白雾，甜腥的冷气迅速弥漫开来。翻滚的黑云骤然失重，像一阵黑雨般纷纷跌落在地。
  en: |
    The CO₂ pad hisses out a pale mist of cold gas. The swirling black cloud loses its lift at once, dropping to the floor in silent sheets.

- id: item_use_scare_01
  category: item_use
  key: scare
  zh: |
    打火机啪地窜起一簇橙黄的火苗。刺眼的火光跳动了一下，蜂群像被烫到似的猛然退散进阴影里。
  en: |
    The lighter sparks and throws up a bright orange tongue of flame. Flinching from the heat, the swarm recoils abruptly into the dark.

- id: item_use_firewall_01
  category: item_use
  key: firewall
  zh: |
    乙醇泼在地面上瞬间化作一堵摇曳的火墙，热浪扑面而来。蜂群在火光另一侧焦躁地盘旋，始终不敢越过那道炽热的边界。
  en: |
    Ethanol splashes across the floor and leaps into a trembling wall of fire. On the far side, the swarm churns frantically, refusing to cross the heat.

- id: item_use_burn_server_01
  category: item_use
  key: burn_server
  zh: |
    火焰吞没那台硬盘灯还在闪烁的机柜时，整栋楼的嗡鸣骤然扭曲成一阵刺耳的乱码震颤。焦糊味里，仿佛有什么庞大的东西在火中剧烈抽搐。
  en: |
    As fire swallows the rack with the blinking drive light, the building's hum warps into a jagged spasm of static. Through the acrid smoke, something vast convulses in the dark.

- id: item_use_dissect_scope_01
  category: item_use
  key: dissect_scope
  zh: |
    目镜下是一只头壳被切开、露出针尖大小灰白神经节的活果蝇。当你伸手去碰桌边的手术刀时，它竟然用和你手指完全相同的弧度，缓缓弯起了右前足。
  en: |
    Through the eyepiece sits a pinned fly with its head capsule opened, exposing a pinpoint of pale ganglion. As your fingers reach for the scalpel beside it, the fly curls its right foreleg at the exact same angle.

- id: item_use_generic_01
  category: item_use
  key: generic
  zh: |
    你试着使用了它。黑暗里没有任何动静，只有空气仿佛稍微沉重了一点。
  en: |
    You put it to use. Nothing answers from the dark, though the air feels a fraction heavier.

# --- 11-16 playtest: success branches and hints -----------------------------

- id: item_use_fuse_gloved_01
  category: item_use
  key: fuse_gloved
  zh: |
    隔着厚厚的防冻手套，你把手探进白雾里。寒气透过内衬咬上指节，但保险丝稳稳落进了掌心，霜花在手套上碎成一层细粉。
  en: |
    Through the thick cryo gloves you reach into the white fog. The cold bites through the lining at your knuckles, but the fuse settles firmly into your palm, its frost crumbling to powder on the glove.

- id: item_use_keycard_cut_01
  category: item_use
  key: keycard_cut
  zh: |
    你用手术刀压住挂绳，刀刃一拉，绷紧的绳子“嘣”地断开。门禁卡滑进你手里，还带着一点她的体温。机械臂的关节轻轻一颤，像是不舍得放手。
  en: |
    You press the scalpel to the lanyard and draw it once. The taut cord snaps. The keycard drops into your hand, still faintly warm from her. The robot arm's joint gives a small shudder, as if reluctant to let go.

- id: item_use_wear_gloves_01
  category: item_use
  key: wear_gloves
  zh: |
    你把防冻手套套上，内衬又厚又涩，手指一下子笨拙了许多。至少现在，你敢去碰那些冰冷的东西了。
  en: |
    You pull the cryo gloves on. The lining is thick and stiff and your fingers turn clumsy at once. But now, at least, you can touch the cold things.

- id: item_use_door_no_power_01
  category: item_use
  key: door_no_power
  zh: |
    你推了推旋转门，加固玻璃纹丝不动。门边的读卡器一片死黑——整栋楼都断了电，这扇门现在只是一堵玻璃墙。
  en: |
    You push the revolving door. The reinforced glass does not move an inch. The card reader beside it is dead black: the whole building has lost power, and for now this door is just a wall of glass.

- id: item_use_door_no_card_01
  category: item_use
  key: door_no_card
  zh: |
    读卡器亮着一粒红灯，屏幕上滚动着「请刷卡」。你身上没有门禁卡。有人进了楼却没签退，卡应该还在她身上。
  en: |
    The card reader glows a single red light, its screen scrolling PLEASE PRESENT CARD. You have no keycard. Someone came in tonight and never signed out; the card should still be on her.

- id: item_use_terminal_dead_01
  category: item_use
  key: terminal_dead
  zh: |
    终端的屏幕一片漆黑，按下电源键也毫无反应。没电，它什么都读不了。电闸箱就在墙边。
  en: |
    The terminal screen stays black; the power button does nothing. Without power it cannot read anything. The fuse box is right there on the wall.

- id: item_use_usb_wrong_slot_01
  category: item_use
  key: usb_wrong_slot
  zh: |
    你在机柜面板上摸了一圈，只摸到散热孔和一排排网线口，没有能插 U 盘的地方。所有线缆都汇向墙角那台终端。
  en: |
    You run your hand over the rack panels and find only vents and rows of network ports, nowhere to plug in a USB drive. Every cable runs to the terminal in the corner.

- id: item_use_slide_wrong_place_01
  category: item_use
  key: slide_wrong_place
  zh: |
    这片组织已经切好了，薄得几乎透明，再放回切片机只会把它毁掉。这么薄的东西，得送进隔壁的电子显微镜才看得清。
  en: |
    This tissue has already been sectioned, so thin it is nearly transparent; putting it back on the microtome would only destroy it. Something this thin needs the electron microscope next door.

- id: item_use_slide_no_power_01
  category: item_use
  key: slide_no_power
  zh: |
    你把玻片放进样品舱，可电子显微镜毫无反应，真空泵一声不响。整栋楼没电，它什么也看不到。
  en: |
    You set the slide in the sample chamber, but the electron microscope does not respond and the vacuum pump stays silent. With the building dark, it can see nothing.

- id: item_use_door_swarm_01
  category: item_use
  key: door_swarm
  zh: |
    你刚把门禁卡举到读卡器前，黑云就从旋转门顶上倒灌下来，把读卡器整个裹住。翅膀拍在你手背上，一下一下，把你往回推。它们不让外面的东西出去。
  en: |
    The moment you raise the keycard to the reader, a black cloud pours down from the top of the revolving door and smothers it. Wings beat against the back of your hand, again and again, pushing you back. They will not let an outsider leave.

- id: item_use_door_swarm_02
  category: item_use
  key: door_swarm
  zh: |
    读卡器亮了绿灯，可旋转门前已经立着一道嗡嗡作响的黑墙。你往前一步，它就往你脸上压一寸，复眼密密麻麻地对着你，像在辨认你是不是自己人。
  en: |
    The reader blinks green, but a humming black wall already stands before the revolving door. Each step you take, it presses an inch closer to your face, compound eyes packed tight, as if checking whether you are one of them.
