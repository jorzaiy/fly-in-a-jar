# world.yaml: machine-readable world for Fly in a Jar (缸中之蝇).
# Source of truth for the story: .kiro/specs/fly-brain-horror/story.md (ch. 3, 4, 6, 7, 8).
# Data shapes and rule table: design.md §3. Validated by `python -m content.validate`.

version: 2
start_scene: reception

# ---------------------------------------------------------------- scenes
# exits: scene ids reachable by `move`. `exit` is the ending pseudo-scene; it is
# never entered by a plain move, only through the escape / disconnected rules.
# ambient: scene-environment stimulus for the brain (design §5.3), resolved in
# config/brain_map.yaml once task 6 lands.
scenes:
  reception:
    name: {zh: 前台, en: Reception}
    aliases: {zh: [前台, 大厅, 接待处], en: [reception, lobby, front desk area]}
    exits: [corridor, exit]
    ambient: null
    fixtures: [reception_desk, drawer, revolving_door, card_reader, desk_phone]
  corridor:
    name: {zh: 走廊, en: Corridor}
    aliases: {zh: [走廊, 过道], en: [corridor, hallway, hall]}
    exits: [reception, fly_room, prep_room, server_room, cold_storage]
    ambient: null
    fixtures: [coat_rack, neuron_photos, safety_poster]
  fly_room:
    name: {zh: 果蝇饲养室, en: Fly Room}
    aliases: {zh: [果蝇饲养室, 饲养室, 果蝇房], en: [fly room, fly lab, rearing room]}
    exits: [corridor]
    ambient: null
    fixtures: [vial_rack, incubator]
  prep_room:
    name: {zh: 解剖准备室, en: Prep Room}
    aliases: {zh: [解剖准备室, 准备室, 解剖室], en: [prep room, preparation room, dissection room]}
