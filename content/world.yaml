# ---------------------------------------------------------------- flags
# caught_fly is also a top-level state field (design §9); rules read/write it
# through the flag name.
flags: [power_on, light_on, ears_plugged, server_burned, caught_fly, read_usb, saw_slide]

# ---------------------------------------------------------------- clues (story.md ch. 6)
# source: brain (PAM spike) or item (an item rule gives it).
# scenes: scenes where a brain clue is most relevant (design §5.4 clue choice).
clues:
  1:  {source: brain, scenes: [server_room, corridor], zh: "停电是因为机房电闸的保险丝烧了。", en: "The blackout is a blown fuse in the server-room fuse box."}
  2:  {source: brain, scenes: [cold_storage, server_room], zh: "冷库的 −80 ℃ 冰柜里有备用保险丝。", en: "There is a spare fuse in the −80 °C freezer in cold storage."}
  3:  {source: brain, scenes: [cold_storage, corridor], zh: "徒手碰 −80 ℃ 会冻伤，走廊衣架上有防冻手套。", en: "Bare hands freeze at −80 °C; there are cryo gloves on the corridor coat rack."}
  4:  {source: item, scenes: [reception], zh: "Weiss 签到进楼没签退，门禁卡在她身上。", en: "Weiss signed in and never signed out. She has the keycard."}
  5:  {source: brain, scenes: [em_room, prep_room], zh: "她倒在电镜室，挂绳缠在机器上，需要刀。", en: "She lies in the EM room, lanyard caught in the machine. You need a blade."}
  6:  {source: brain, scenes: [], zh: "蜂群怕火。", en: "The swarm fears fire."}
  7:  {source: brain, scenes: [corridor, fly_room], zh: "实验室用 CO₂ 麻醉果蝇。", en: "The lab knocks flies out with CO₂."}
  8:  {source: item, scenes: [em_room], zh: "蜂群不伤害\"自己的一份子\"。", en: "The swarm does not harm one of its own."}
  9:  {source: brain, scenes: [fly_room], zh: "甜味能把它们引开。", en: "Sweetness draws them away."}
  10: {source: item, scenes: [cold_storage], zh: "样本盒标签上是你的名字。", en: "The sample box is labelled with your name."}
  11: {source: item, scenes: [server_room], zh: "停电前连接组在服务器上自己运行了。", en: "Before the blackout the connectome started running on its own."}
  12: {source: item, scenes: [em_room], zh: "第 4096 号切片是 Weiss；显微镜在等新样本。", en: "Slide #4096 is Weiss. The microscope is waiting for a new specimen."}
  13: {source: brain, scenes: [], sync_min: 70, zh: "玻片编号排到 11096；你的签到字迹是果蝇拼的。", en: "The slides run to 11096. Your signature was written by flies."}

# ---------------------------------------------------------------- item-use rules (design §3)
# Evaluated in order; the first rule whose trigger and conditions match wins.
#
# trigger: list of {actions: [judge categories], targets: [item / fixture / scene ids, monster]}
# when (all must hold):
#   scene, items (held), reachable (held or lying in this scene), not_items,
#   flags, not_flags (caught_fly reads the state field), monster_near, sync_min
# effects:
#   block: true        action fails (no normal take/move happens)
#   sync: n            assimilation change
#   set_flags / clear_flags
#   consume: [items]   removed from inventory
#   transform: {from: to}
#   monster_block / monster_stunned: n   turns
#   monster_near: bool
#   clue: n            gives clue n (narrated as clue.clue_n)
#   ending: id         ends the game (narrated as ending.<id>)
#   dampen_anomaly: visual|sound   narrator hint (design §3: one tier lower)
# Fragment key: item_use.<id>, unless the rule gives a clue (clue.clue_<n>) or an ending (ending.<id>).
rules:
  - id: fuse_frostbite
    trigger: [{actions: [take, touch, use], targets: [fuse]}]
    when: {scene: cold_storage, not_items: [cryo_gloves]}
    effects: {block: true, sync: 5}

  - id: keycard_tangled
    trigger: [{actions: [take], targets: [keycard]}]
    when: {scene: em_room, not_items: [scalpel]}
    effects: {block: true}

  - id: restore_power
    trigger: [{actions: [use], targets: [fuse, fuse_box]}]
    when: {scene: server_room, items: [fuse]}
    effects: {set_flags: [power_on], consume: [fuse]}

  # Fourth ending must be checked before the plain escape.
  - id: disconnected
    trigger:
      - {actions: [use], targets: [keycard, card_reader, revolving_door]}
      - {actions: [move], targets: [exit]}
    when: {scene: reception, items: [keycard], flags: [server_burned, ears_plugged], not_flags: [caught_fly]}
    effects: {ending: disconnected}

  - id: escape
    trigger:
      - {actions: [use], targets: [keycard, card_reader, revolving_door]}
      - {actions: [move], targets: [exit]}
    when: {scene: reception, items: [keycard], flags: [power_on]}
    effects: {ending: escaped}

  - id: light
    trigger: [{actions: [use, light], targets: [flashlight]}]
    when: {items: [flashlight]}
    effects: {set_flags: [light_on], dampen_anomaly: visual}

  - id: plug_ears
    trigger: [{actions: [use], targets: [earplugs]}]
    when: {items: [earplugs]}
    effects: {set_flags: [ears_plugged], dampen_anomaly: sound}

  - id: bait
    trigger: [{actions: [use], targets: [sugar_cube]}]
    when: {items: [sugar_cube]}
    effects: {monster_block: 2, consume: [sugar_cube]}

  - id: catch_fly
    trigger:
      - {actions: [use], targets: [vial]}
      - {actions: [take], targets: [monster]}
    when: {items: [vial], monster_near: true}
    effects: {transform: {vial: vial_fly}, set_flags: [caught_fly]}

  - id: stun
    trigger: [{actions: [use], targets: [co2_pad]}]
    when: {items: [co2_pad], monster_near: true}
    effects: {monster_stunned: 2, consume: [co2_pad]}

  # Burning the server is checked before the generic ethanol / lighter rules.
  - id: burn_server
    trigger:
      - {actions: [use, attack], targets: [server_rack]}
      - {actions: [use], targets: [ethanol, lighter]}
    when: {scene: server_room, items: [ethanol, lighter], flags: [read_usb]}
    effects: {set_flags: [server_burned], consume: [ethanol], monster_block: 3}

  - id: scare
    trigger:
      - {actions: [use], targets: [lighter]}
      - {actions: [attack], targets: [monster]}
    when: {items: [lighter], monster_near: true}
    effects: {monster_near: false}

  - id: firewall
    trigger: [{actions: [use], targets: [ethanol]}]
    when: {items: [ethanol, lighter]}
    effects: {monster_block: 4, consume: [ethanol]}

  - id: read_log
    trigger: [{actions: [use, look], targets: [visitor_log]}]
    when: {reachable: [visitor_log]}
    effects: {clue: 4}

  - id: play_recorder
    trigger: [{actions: [use, listen], targets: [recorder]}]
    when: {reachable: [recorder]}
    effects: {clue: 8}

  - id: open_box
    trigger: [{actions: [use], targets: [sample_box]}]
    when: {reachable: [sample_box]}
    effects: {clue: 10, sync: 5}

  - id: read_usb
    trigger: [{actions: [use], targets: [usb_drive, terminal]}]
    when: {scene: server_room, reachable: [usb_drive], flags: [power_on]}
    effects: {clue: 11, set_flags: [read_usb]}

  # Hidden ending before the slide view so the microscope means "lie down" once ready.
  - id: absorbed
    trigger: [{actions: [use], targets: [electron_microscope]}]
    when: {scene: em_room, flags: [saw_slide], sync_min: 70}
    effects: {ending: absorbed}

  - id: view_slide
    trigger: [{actions: [use, look], targets: [slide_4096, electron_microscope]}]
    when: {scene: em_room, items: [slide_4096], flags: [power_on]}
    effects: {clue: 12, set_flags: [saw_slide]}

  # Story ch. 5.3: the dissecting-scope stare. Narrative only, no state change.
  - id: dissect_scope
    trigger: [{actions: [look, use], targets: [dissecting_scope]}]
    when: {scene: prep_room}
    effects: {}

# ---------------------------------------------------------------- endings (design §3, story ch. 7–8)
endings:
  escaped:      {rule: escape, summary: "Power restored, keycard swiped at reception."}
  consumed:     {sync_min: 100, summary: "Synaptic sync reaches 100%."}
  absorbed:     {rule: absorbed, summary: "Saw slide #4096 under power, sync >= 70, used the electron microscope."}
  disconnected: {rule: disconnected, summary: "Never caught a fly, ears plugged, read the USB, burned the server, swiped the keycard."}

# ---------------------------------------------------------------- judge hints (design §6.2)
# Plain-English world rules sent to Jev with every state.
judge_rules_en:
  - The player is an ordinary human night-shift assistant. Humans cannot fly, teleport or walk through walls.
  - The building has no power until a working fuse is fitted in the server-room fuse box.
  - The revolving door at reception is locked reinforced glass. It opens only by swiping a keycard on the card reader while the building has power.
  - All phones are dead. There is no signal and no one to call.
  - Items can only be used if the player is carrying them; items lying in the current scene can be taken.
  - Touching anything inside the −80 °C freezer bare-handed causes frostbite; cryo gloves prevent it.
  - Dr. Weiss's keycard lanyard is tangled in the robotic arm and must be cut with a blade.
  - The swarm is a cloud of fruit flies. It fears fire and CO₂ and is drawn to sweetness.
