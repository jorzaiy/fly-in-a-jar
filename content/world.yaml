  em_room:
    name: {zh: 电镜室, en: EM Room}
    aliases: {zh: [电镜室], en: [em room, electron microscopy room, microscope room]}
    exits: [prep_room]
    ambient: null
    fixtures: [electron_microscope, robot_arm, console, weiss_body]
  server_room:
    name: {zh: 机房, en: Server Room}
